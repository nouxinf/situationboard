<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<link
			rel="preconnect"
			href="https://fonts.googleapis.com"
		/>
		<link
			rel="preconnect"
			href="https://fonts.gstatic.com"
			crossorigin
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
			rel="stylesheet"
		/>
		<link
			rel="stylesheet"
			href="libs/leaflet.css"
		/>
		<link
			rel="icon"
			href="/favicon.svg"
			type="image/svg+xml"
		/>
		<title>Situationboard</title>
		<link
			rel="stylesheet"
			href="styles.css"
		/>
	</head>
	<body>
		<h1 id="heading">SituationBoard</h1>
		<ul id="widgets"></ul>
		<dialog
			id="add-widgets"
			closedby="any"
		>
			<h2 id="add-widgets-heading">Add widgets</h2>
			<div id="widgets-list"></div>
		</dialog>
		<dialog
			id="catpic-zoom"
			closedby="any"
		>
			<img id="zoomed-catpic" />
		</dialog>
		<dialog
			id="weather-select"
			closedby="any"
		>
			<div id="map"></div>
			<button id="confirm-weather-select">Confirm Location</button>
		</dialog>
		<dialog
			id="weather-settings"
			closedby="any"
		>
			<h2>Weather widget settings</h2>
			<select id="temp-units">
				<option value="celsius">Celsius</option>
				<option value="fahrenheit">Fahrenheit</option>
			</select>
			<button id="save-weather-settings">Save</button>
		</dialog>
		<dialog
			id="xkcd-zoom"
			closedby="any"
		>
			<img id="zoomed-xkcd" />
			<i><h2 id="big-xkcd-subtitle"></h2></i>
		</dialog>
		<script src="libs/marked.umd.js"></script>
		<script src="libs/dompurify.js"></script>
		<script src="libs/leaflet.js"></script>
		<script src="weather.js"></script>
		<script src="clock.js"></script>
		<script src="catpic.js"></script>
		<script src="oilprice.js"></script>
		<script src="xkcd.js"></script>
		<script src="widget.js"></script>
	</body>
</html>
