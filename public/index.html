<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<link
			rel="preconnect"
			href="https://fonts.googleapis.com"
		/>
		<link
			rel="preconnect"
			href="https://fonts.gstatic.com"
			crossorigin
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
			rel="stylesheet"
		/>
		<link
			rel="icon"
			href="/favicon.svg"
			type="image/svg+xml"
		/>
		<title>Situationboard</title>
		<link
			rel="stylesheet"
			href="styles.css"
		/>
	</head>
	<body>
		<h1 id="heading">SituationBoard</h1>
		<ul id="widgets"></ul>
		<dialog
			id="add-widgets"
			closedby="any"
		>
			<h2 id="add-widgets-heading">Add widgets</h2>
			<input
				type="search"
				results
			/>
			<div id="widgets-list"></div>
		</dialog>
		<dialog
			id="catpic-zoom"
			closedby="any"
		>
			<img id="zoomed-catpic" />
		</dialog>
		<script src="libs/marked.umd.js"></script>
		<script src="libs/dompurify.js"></script>
		<script src="clock.js"></script>
		<script src="catpic.js"></script>
		<script src="oilprice.js"></script>
		<script src="widget.js"></script>
	</body>
</html>
